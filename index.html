<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadn’s Learning Hub</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#14263a;--mute:#5d6b7a;--line:#dde3ea;--acc:#1f4e8c;--gold:#c8921a;--ok:#2f7d4f}
[data-theme=dark]{--bg:#0e1621;--card:#16212f;--ink:#e8edf3;--mute:#94a3b3;--line:#27364a;--acc:#6aa3e8;--gold:#e3b04b;--ok:#5cc08a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
[dir=rtl] body{font-family:"Noto Naskh Arabic",Tahoma,system-ui,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;margin:0 0 .4em;line-height:1.2}
h1{font-size:1.9rem}h2{font-size:1.2rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand b{font:600 1.1rem Georgia,serif;display:block}.brand small{color:var(--gold);font-size:.8rem}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:9px 14px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.danger{background:transparent;color:#c0392b;border-color:#c0392b}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.nav a{white-space:nowrap;padding:8px 14px;border-radius:8px;color:var(--mute);text-decoration:none}
.nav a.on{background:var(--acc);color:#fff}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.hero{padding:8px 0 20px}.hero p{color:var(--mute);margin:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.big{grid-column:1/-1}
.num{font:600 2rem Georgia,serif}.lbl{color:var(--mute);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mute)}
.chart span{width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.soon{border-style:dashed}.soon p{color:var(--mute);margin:.3em 0 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
textarea{font:inherit;width:100%;min-height:110px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.msg{color:var(--mute);font-size:.9rem;margin:6px 0}.chip{font-size:.75rem;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--mute)}
.flash{text-align:center;padding:36px 16px}.flash .w{font:600 2rem Georgia,serif}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item.done b{text-decoration:line-through;color:var(--mute)}.small{padding:5px 9px;font-size:.85rem}
details summary{cursor:pointer;font-weight:600}.fg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;gap:0;overflow:visible;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-bottom:0}
.nav a{flex:1;text-align:center;font-size:.72rem;padding:4px 2px;line-height:1.2}
.nav a span{display:block;font-size:1.3rem}
main{padding-bottom:96px}
button,.nav a{min-height:44px}
details>summary{padding:4px 0}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="brandName">Shadn’s Learning Hub</b><small data-i="tagline"></small></div>
  <div class="tools">
    <button id="langBtn" class="ghost" aria-label="Language">عربي</button>
    <button id="themeBtn" class="ghost" aria-label="Theme">◐</button>
  </div>
</header>
<nav id="nav" class="nav"></nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
var KEY='shadnHub.v1';
var T={en:{tagline:'Learn Better. Grow Further.',dash:'Dashboard',english:'British English',german:'German',alsun:'Alsun',settings:'Settings',
 hi:'Welcome back, ',sub:'Everything here is calculated from the study time you log.',
 prog:'Overall progress',lessons:'Completed lessons',exams:'Passed exams',avg:'Average exam score',hours:'Total study hours',streak:'Study streak (days)',
 today:'Today',goalD:'Daily goal (min)',goalW:'This week (min)',week:'Weekly activity (minutes)',log:'Log study time',subject:'Subject',minutes:'Minutes',add:'Save session',
 none:'No exams yet',nolesson:'Lessons arrive in the next stage. No lessons yet.',recent:'Recent sessions',norecent:'No sessions logged yet. Log your first one above.',
 soonT:'Coming in the next stage',soonB:'This section has no lessons yet. The lesson and exam engine is built next.',
 profile:'Profile',name:'Name',save:'Save',backup:'Backup and restore',backupNote:'Your data is stored only in this browser. Export a backup regularly, especially before clearing browser data or changing device.',
 exp:'Export backup (JSON)',imp:'Import backup',reset:'Reset all progress',confirm:'Delete all saved progress? This cannot be undone.',saved:'Saved',imported:'Backup imported',bad:'That file is not a valid backup.',days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
 en:'British English',de:'German',al:'Alsun'},
ar:{tagline:'تعلّمي أفضل. انطلقي أبعد.',dash:'الرئيسية',english:'الإنجليزية البريطانية',german:'الألمانية',alsun:'ألسن',settings:'الإعدادات',
 hi:'أهلاً بعودتك، ',sub:'كل الأرقام هنا محسوبة من وقت المذاكرة الذي تسجّلينه.',
 prog:'التقدم الكلي',lessons:'الدروس المكتملة',exams:'الاختبارات المجتازة',avg:'متوسط الدرجات',hours:'إجمالي ساعات المذاكرة',streak:'أيام متتالية',
 today:'اليوم',goalD:'الهدف اليومي (دقيقة)',goalW:'هذا الأسبوع (دقيقة)',week:'النشاط الأسبوعي (دقائق)',log:'سجّلي وقت المذاكرة',subject:'المادة',minutes:'الدقائق',add:'حفظ الجلسة',
 none:'لا اختبارات بعد',nolesson:'الدروس تأتي في المرحلة التالية. لا توجد دروس بعد.',recent:'آخر الجلسات',norecent:'لم تُسجَّل جلسات بعد. سجّلي أول جلسة من الأعلى.',
 soonT:'قريباً في المرحلة التالية',soonB:'لا توجد دروس في هذا القسم بعد. يُبنى محرك الدروس والاختبارات تالياً.',
 profile:'الملف الشخصي',name:'الاسم',save:'حفظ',backup:'النسخ الاحتياطي والاستعادة',backupNote:'بياناتك محفوظة في هذا المتصفح فقط. صدّري نسخة احتياطية بانتظام، خاصة قبل مسح بيانات المتصفح أو تغيير الجهاز.',
 exp:'تصدير نسخة احتياطية (JSON)',imp:'استيراد نسخة احتياطية',reset:'مسح كل التقدم',confirm:'هل تريدين حذف كل التقدم المحفوظ؟ لا يمكن التراجع.',saved:'تم الحفظ',imported:'تم استيراد النسخة',bad:'هذا الملف ليس نسخة احتياطية صالحة.',days:['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],
 en:'الإنجليزية البريطانية',de:'الألمانية',al:'ألسن'}};
Object.assign(T.en,{translator:'Translator',sentences:'Sentences and audio',study:'Study',practice:'Practice',more:'More',wiki:'Encyclopedia',pron:'Pronunciation',tprac:'Translation practice',library:'Library',resources:'Courses',progress:'Progress',mistakes:'Mistakes',vocab:'Vocabulary',planner:'Planner'});Object.assign(T.ar,{translator:'المترجم',sentences:'جمل وصوتيات',study:'ادرسي',practice:'تدرّبي',more:'المزيد',wiki:'الموسوعة',pron:'النطق',tprac:'تدريب الترجمة',library:'المكتبة',resources:'الكورسات',progress:'التقدم',mistakes:'دفتر الأخطاء',vocab:'المفردات',planner:'المخطط'});
var DEF={v:1,mistakes:[],attempts:[],vocab:[],tasks:[],history:[],name:'Shadn',lang:'en',theme:'light',dailyGoal:30,sessions:[],lessonsDone:[],exams:[]};
var S=load();
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,r||{})}catch(e){return Object.assign({},DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage unavailable')}}
function t(k){return (T[S.lang]||T.en)[k]||T.en[k]||k}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ds(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function mins(day){return S.sessions.reduce(function(a,s){return a+(s.d===day?s.min:0)},0)}
function streak(){var d=new Date(),n=0;if(!mins(ds(d)))d.setDate(d.getDate()-1);while(mins(ds(d))>0){n++;d.setDate(d.getDate()-1)}return n}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='show';setTimeout(function(){e.className=''},2000)}
function apply(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=S.theme;
 document.getElementById('langBtn').textContent=S.lang==='ar'?'English':'عربي';
 document.querySelector('[data-i=tagline]').textContent=t('tagline');
 document.getElementById('brandName').textContent=S.lang==='ar'?'منصة '+S.name+' التعليمية':S.name+'’s Learning Hub'}
window.Hub={get S(){return S},save:save,t:t,esc:esc,ds:ds,toast:toast,render:render,mods:{},L:function(e,a){return S.lang==='ar'?a:e}};
var routes=['dash','sentences','study','practice','more','wiki','translator','vocab','planner','mistakes','pron','tprac','library','resources','progress','english','german','alsun','settings'];
function route(){var h=location.hash.slice(1);return routes.indexOf(h)>-1?h:'dash'}
var TABS=[['dash','🏠',['dash']],['study','📚',['study','english','german','alsun','wiki']],['practice','🎯',['practice','sentences','translator','pron','tprac','library','mistakes']],['vocab','🔤',['vocab']],['more','☰',['more','planner','progress','resources','settings']]];
function nav(){var r=route();document.getElementById('nav').innerHTML=TABS.map(function(x){return '<a href="#'+x[0]+'"'+(x[2].indexOf(r)>-1?' class="on" aria-current="page"':'')+'><span>'+x[1]+'</span>'+t(x[0]==='dash'?'dash':x[0])+'</a>'}).join('')}
function cont(){var c=Hub.cont&&Hub.cont(),n=S.vocab.filter(function(w){return w.due<=ds(new Date())}).length;
 return '<div class="card"><div class="lbl">'+Hub.L('Today','اليوم')+'</div>'+(c?'<b>'+esc(c.title)+'</b><br><button id="cont" data-k="'+c.k+'" data-id="'+c.id+'">'+Hub.L('Continue learning','أكملي التعلم')+'</button> ':'')+(n?'<a href="#vocab"><button class="ghost">'+Hub.L('Review '+n+' words','راجعي '+n+' كلمة')+'</button></a>':'')+'</div><br>'}
function dash(){
 var now=new Date(),tot=S.sessions.reduce(function(a,s){return a+s.min},0),today=mins(ds(now)),wk=0,bars='',mx=1,vals=[];
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var m=mins(ds(d));vals.push([d.getDay(),m]);wk+=m;mx=Math.max(mx,m)}
 bars=vals.map(function(v){return '<div><span style="height:'+Math.round(v[1]/mx*100)+'%"></span>'+t('days')[v[0]]+'</div>'}).join('');
 var avg=S.exams.length?Math.round(S.exams.reduce(function(a,e){return a+e.score},0)/S.exams.length)+'%':'—';
 var pass=S.exams.filter(function(e){return e.score>=80}).length;
 var pct=Math.min(100,Math.round(today/S.dailyGoal*100));
 var rec=S.sessions.slice(-5).reverse().map(function(s){return '<li>'+esc(s.d)+' · '+esc(s.subject)+' · '+s.min+'</li>'}).join('');
 return '<section class="hero"><h1>'+t('hi')+esc(S.name)+'</h1><p>'+t('sub')+'</p></section>'+cont()+
 '<div class="grid"><div class="card"><div class="lbl">'+t('goalD')+'</div><div class="num">'+today+' / '+S.dailyGoal+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
 '<div class="card"><div class="lbl">'+t('goalW')+'</div><div class="num">'+wk+' / '+S.dailyGoal*7+'</div><div class="bar"><i style="width:'+Math.min(100,Math.round(wk/(S.dailyGoal*7)*100))+'%"></i></div></div>'+
 '<div class="card"><div class="lbl">'+t('streak')+'</div><div class="num">'+streak()+'</div></div>'+
 '<div class="card"><div class="lbl">'+t('hours')+'</div><div class="num">'+(tot/60).toFixed(1)+'</div></div>'+
 '<div class="card"><div class="lbl">'+t('lessons')+'</div><div class="num">'+S.lessonsDone.length+'</div></div>'+
 '<div class="card"><div class="lbl">'+t('exams')+'</div><div class="num">'+pass+'</div></div>'+
 '<div class="card"><div class="lbl">'+t('avg')+'</div><div class="num">'+avg+'</div></div></div>'+
 '<div class="grid"><div class="card big"><h2>'+t('week')+'</h2><div class="chart">'+bars+'</div></div>'+
 '<div class="card big"><h2>'+t('log')+'</h2><div class="row"><label>'+t('subject')+' <select id="sub"><option>'+t('en')+'</option><option>'+t('de')+'</option><option>'+t('al')+'</option></select></label>'+
 '<label>'+t('minutes')+' <input id="min" type="number" min="1" max="600" value="25"></label><button id="addS">'+t('add')+'</button></div></div>'+
 '<div class="card big"><h2>'+t('recent')+'</h2>'+(rec?'<ul>'+rec+'</ul>':'<p class="lbl">'+t('norecent')+'</p>')+'</div></div>'+
 '<div class="grid">'+['english','german','alsun'].map(function(k){return '<a class="card" href="#'+k+'" style="text-decoration:none;color:inherit"><h2>'+t(k)+'</h2>'+prog(k)+'</a>'}).join('')+'</div>'}
function prog(k){var c=window.COURSE&&COURSE[k];if(!c)return '<div class="lbl">'+t('nolesson')+'</div><div class="bar"><i style="width:0"></i></div>';var n=0,d=0;c.levels.forEach(function(l){l.units.forEach(function(u){u.lessons.forEach(function(x){n++;if(S.lessonsDone.indexOf(x.id)>-1)d++})})});return '<div class="lbl">'+d+' / '+n+'</div><div class="bar"><i style="width:'+Math.round(d/n*100)+'%"></i></div>'}
function soon(k){return '<h1>'+t(k)+'</h1><div class="card soon"><h2>'+t('soonT')+'</h2><p>'+t('soonB')+'</p></div>'}
function settings(){return '<h1>'+t('settings')+'</h1><div class="card"><h2>'+t('profile')+'</h2><div class="row"><label>'+t('name')+' <input id="nm" value="'+esc(S.name)+'" maxlength="30"></label>'+
 '<label>'+t('goalD')+' <input id="gl" type="number" min="5" max="600" value="'+S.dailyGoal+'"></label><button id="sv">'+t('save')+'</button></div></div><br>'+
 '<div class="card"><h2>'+t('backup')+'</h2><p class="lbl">'+t('backupNote')+'</p><div class="row"><button id="ex">'+t('exp')+'</button><button class="ghost" id="im">'+t('imp')+'</button><input id="fi" type="file" accept="application/json" hidden></div></div><br>'+
 '<button class="danger" id="rs">'+t('reset')+'</button>'}
function bind(){
 var ct=document.getElementById('cont');if(ct)ct.onclick=function(){Hub.open(ct.dataset.k,ct.dataset.id)};
 var a=document.getElementById('addS');if(a)a.onclick=function(){var m=parseInt(document.getElementById('min').value,10);if(!(m>0))return;
  S.sessions.push({d:ds(new Date()),min:Math.min(m,600),subject:document.getElementById('sub').value});save();render();toast(t('saved'))};
 var sv=document.getElementById('sv');if(sv)sv.onclick=function(){S.name=document.getElementById('nm').value.trim()||'Shadn';S.dailyGoal=Math.max(5,parseInt(document.getElementById('gl').value,10)||30);save();apply();toast(t('saved'))};
 var ex=document.getElementById('ex');if(ex)ex.onclick=function(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='shadns-learning-hub-backup-'+ds(new Date())+'.json';l.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
 var im=document.getElementById('im'),fi=document.getElementById('fi');if(im){im.onclick=function(){fi.click()};fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.sessions))throw 0;S=Object.assign({},DEF,d);save();apply();render();toast(t('imported'))}catch(e){toast(t('bad'))}};r.readAsText(f)}}
 var rs=document.getElementById('rs');if(rs)rs.onclick=function(){if(confirm(t('confirm'))){var l=S.lang,th=S.theme;S=Object.assign({},DEF,{lang:l,theme:th});save();apply();render()}}}
function render(){var r=route();nav();var m=Hub.mods[r];document.getElementById('view').innerHTML=m?m.html():r==='dash'?dash():r==='settings'?settings():soon(r);bind();if(m&&m.bind)m.bind()}
document.getElementById('langBtn').onclick=function(){S.lang=S.lang==='ar'?'en':'ar';save();apply();render()};
document.getElementById('themeBtn').onclick=function(){S.theme=S.theme==='dark'?'light':'dark';save();apply()};
window.addEventListener('hashchange',render);
window.addEventListener('load',function(){apply();render()});
})();

</script>
<script>
(function(){
var H=Hub,L=H.L,q=function(i){return document.getElementById(i)};
var TAG={gb:'en-GB',us:'en-US',de:'de-DE',ar:'ar'};
var NAME={gb:['British','بريطاني'],us:['American','أمريكي'],de:['German','ألماني'],ar:['Arabic','عربي']};
var LN={ar:['Arabic','العربية'],en:['English','الإنجليزية'],de:['German','الألمانية']};
var st={from:'en',to:'ar',src:'',out:'',acc:'gb'};
function voices(a){if(!('speechSynthesis' in window))return[];return speechSynthesis.getVoices().filter(function(v){var l=v.lang.replace('_','-').toLowerCase();return a==='ar'?l.indexOf('ar')===0:l===TAG[a].toLowerCase()})}
H.has=function(a){return voices(a).length>0};
H.speak=function(text,a,name,cb){
 if(!('speechSynthesis' in window))return L('Speech is not supported in this browser.','المتصفح لا يدعم النطق.');
 if(!text)return L('Nothing to read.','لا يوجد نص.');
 var vs=voices(a);if(!vs.length)return L('No '+TAG[a]+' voice was detected on this device, so nothing was played. Install one in your device’s speech settings.','لم يتم العثور على صوت '+TAG[a]+' على هذا الجهاز فلم يُشغَّل شيء. ثبّتي الصوت من إعدادات النطق في الجهاز.');
 var v=vs.filter(function(x){return x.name===name})[0]||vs[0];speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=H.rate||1;if(cb)u.onend=cb;speechSynthesis.speak(u);return L('Playing: '+v.name+' ('+v.lang+')','يعمل الآن: '+v.name+' ('+v.lang+')')};
function avail(){var e=q('avail');if(!e)return;e.textContent=['gb','us','de','ar'].map(function(a){return NAME[a][H.S.lang==='ar'?1:0]+': '+(voices(a).length?'✓':'✗')}).join('   ')}
function fillSel(a){var s=q('vsel');if(!s)return;s.innerHTML=voices(a).map(function(v){return '<option>'+H.esc(v.name)+'</option>'}).join('')}
function opts(sel){return Object.keys(LN).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+LN[k][H.S.lang==='ar'?1:0]+'</option>'}).join('')}
function vb(id){return '<div class="row">'+['gb','us','de','ar'].map(function(a){return '<button class="ghost small" data-a="'+a+'" data-t="'+id+'">🔊 '+NAME[a][H.S.lang==='ar'?1:0]+'</button>'}).join('')+'<button class="ghost small" id="stop">■ '+L('Stop','إيقاف')+'</button></div>'}
H.mods.translator={html:function(){
 return '<h1>'+H.t('translator')+'</h1><div class="card"><div class="row"><select id="from">'+opts(st.from)+'</select><button class="ghost" id="swap" aria-label="swap">⇄</button><select id="to">'+opts(st.to)+'</select></div>'+
 '<br><textarea id="src" placeholder="'+L('Type or paste text (up to 500 characters)','اكتبي أو الصقي النص (حتى 500 حرف)')+'" maxlength="500">'+H.esc(st.src)+'</textarea>'+vb('src')+

<script>
window.COURSE=window.COURSE||{};
COURSE.english={title:"British English",levels:[{id:"A1",units:[
{id:"a1u1",title:"Unit 1: Meeting people",lessons:[
{id:"en-a1-be",title:"The verb 'to be' (am, is, are)",
obj:["Use am, is and are with the correct subject","Make negatives and questions with 'to be'","Give natural British short answers"],
body:"<p>'To be' is the most important verb in English. It links a subject to a name, job, age, place or feeling.</p><table><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr><tr><td>I</td><td>I am / I'm</td><td>I'm not</td><td>Am I?</td></tr><tr><td>you / we / they</td><td>you are / you're</td><td>aren't / are not</td><td>Are you?</td></tr><tr><td>he / she / it</td><td>she is / she's</td><td>isn't / is not</td><td>Is she?</td></tr></table><p>In questions, the verb comes <b>before</b> the subject: <i>Are you a student?</i> In short answers, never shorten the positive: say <i>Yes, I am</i>, not <i>Yes, I'm</i>. Negative short answers can be short: <i>No, I'm not</i> or <i>No, she isn't</i>.</p>",
ex:["I'm Shadn. I'm from Egypt.","She is a student at Alsun.","They aren't at home today.","Are you tired? – Yes, I am.","Is it cold in London? – No, it isn't."],
mist:[["I student.","I am a student.","English needs a verb in every sentence."],["She are my friend.","She is my friend.","Use 'is' with he, she and it."],["Are you ready? – Yes, I'm.","Yes, I am.","A positive short answer is never contracted."]],
ar:"في العربية لا نستخدم فعل الكون في المضارع (أنا طالبة)، لكن في الإنجليزية لازم نقول I am a student. لا تحذفي am / is / are أبداً.",
prac:[["Complete: We ___ in the library.","are"],["Make negative: He is late.","He isn't late."],["Make a question: You are a teacher.","Are you a teacher?"]],
real:"On your first day at university, a British classmate may ask: 'Hi, are you new here?' You can answer: 'Yes, I am. I'm Shadn. I'm from Cairo.'",
sum:"Use am with I, is with he/she/it, are with you/we/they. Put the verb first in questions. Answer positively with the full form: Yes, I am.",
vocab:[["student","طالبة"],["teacher","معلمة"],["tired","متعبة"],["ready","جاهزة"],["new","جديدة"]],
exam:[["mc","She ___ from Cairo.",["am","is","are"],1,"With she, he and it we use 'is'."],
["mc","___ you a student?",["Is","Am","Are"],2,"With you we use 'are', and the verb comes first in a question."],
["tf","'I'm' is the short form of 'I am'.",true,"I'm = I + am."],
["tx","Complete: They ___ at home. (be)",["are"],"With they we use 'are'."],
["mc","Choose the correct negative: He ___ here.",["aren't","isn't","amn't"],1,"He + is not = isn't. 'Amn't' is not standard."],
["tx","Correct this sentence: She are my friend.",["she is my friend"],"She takes 'is'."],
["tx","Translate into English: أنا طالبة في الجامعة.",["i am a student at the university","i'm a student at the university","i am a university student","i'm a university student","i am a student at university","i'm a student at university"],"Add 'am': I am a student. Several wordings are correct."],
["mc","'Are you tired?' – 'Yes, ___.'",["I'm","I am","I be"],1,"Positive short answers use the full form."]]},
{id:"en-a1-art",title:"Articles: a, an and the",
obj:["Choose a or an by the first sound","Use the for specific things","Use British patterns such as 'at university' and 'in hospital'"],
body:"<p>We use <b>a</b> or <b>an</b> with one singular, countable thing when we mention it for the first time. We use <b>the</b> when both people know which thing we mean.</p><table><tr><th>Article</th><th>Use</th><th>Example</th></tr><tr><td>a</td><td>before a consonant <i>sound</i></td><td>a book, a university (sounds like 'you')</td></tr><tr><td>an</td><td>before a vowel <i>sound</i></td><td>an apple, an hour (the h is silent)</td></tr><tr><td>the</td><td>specific or already mentioned</td><td>I bought a book. The book is great.</td></tr><tr><td>no article</td><td>plural or uncountable in general</td><td>I like books. I like music.</td></tr></table><p><b>British note:</b> we often omit 'the' for institutions when we mean their main purpose: <i>She is at university</i>, <i>He is in hospital</i> (as a patient), <i>The children are at school</i>. Compare: <i>I met her at the university</i> (the building).</p>",
ex:["I have a brother and an uncle.","She's an honest girl.","We live in a flat. The flat is small.","I like tea, but I don't like coffee.","He's in hospital after the accident."],
mist:[["She is a honest girl.","She is an honest girl.","Honest begins with a vowel sound."],["I like the music.","I like music.","General likes need no article."],["She goes to the university every day.","She goes to university every day.","British English omits 'the' when it means studying."]],
ar:"العربية فيها 'ال' التعريف فقط، أما الإنجليزية فلها a/an للنكرة وthe للمعرفة. انتبهي: a/an تعتمد على الصوت وليس على الحرف المكتوب.",
prac:[["a or an: ___ umbrella","an"],["a or an: ___ European city","a"],["Complete: I bought a coat. ___ coat is red.","The"]],

{id:"en-a1-brit",title:"British spelling and everyday vocabulary",

<script>
window.COURSE=window.COURSE||{};
COURSE.german={title:"Deutsch",levels:[{id:"A1",units:[{id:"deu1",title:"Unit 1: First steps in German",lessons:[
{id:"de-a1-abc",title:"The alphabet and key sounds",
obj:["Say the German letters and the extra letters ä, ö, ü and ß","Read the main spelling-sound rules","Pronounce ei, ie, eu, sp, st, w and z correctly"],
body:"<p>German has the same 26 letters as English plus <b>ä, ö, ü</b> and <b>ß</b>. German spelling is much more regular than English: once you know the rules, you can read almost any word aloud.</p><table><tr><th>Spelling</th><th>Sound</th><th>Example</th></tr><tr><td>ei</td><td>like English 'eye'</td><td>nein, Eis</td></tr><tr><td>ie</td><td>long 'ee'</td><td>Bier, Liebe</td></tr><tr><td>eu / äu</td><td>like 'oy'</td><td>neu, Häuser</td></tr><tr><td>w</td><td>like English v</td><td>Wasser</td></tr><tr><td>v</td><td>usually like f</td><td>Vater</td></tr><tr><td>z</td><td>ts</td><td>Zeit</td></tr><tr><td>sp / st at the start</td><td>schp / scht</td><td>sprechen, Straße</td></tr><tr><td>ß</td><td>sharp s (written ss in Switzerland and in capitals)</td><td>Straße</td></tr></table><p>The letter <b>ch</b> has two sounds: soft after e, i, ä, ö, ü (ich) and hard after a, o, u (Nacht). At the end of a word, b, d and g sound like p, t and k: <i>Tag</i> sounds like 'tahk'.</p>",
ex:["Eis (ice cream) – Bier (beer)","Wasser (water) – Vater (father)","Zeit (time) – Zimmer (room)","Sprechen Sie Deutsch?","Das ist eine Straße."],
mist:[["Saying 'ie' as 'eye'","ie = long 'ee'","ei is 'eye', ie is 'ee': remember the second letter."],["Saying w as English w","w = v","Wasser sounds like 'vasser'."],["Saying z as English z","z = ts","Zeit sounds like 'tsite'."]],
ar:"ترتيب الحروف في ei وie هو سر التفرقة: الحرف الثاني هو الذي ينطق (ei = آي، ie = ي طويلة). والحرف z في الألمانية ينطق تس، وw ينطق ڤ.",
prac:[["Read aloud: Wein, Bier, Eis","vyne, beer, ice"],["Which sound: Nacht or ich is soft?","ich"],["Write Straße with ss","Strasse"]],
real:"When you give your name or spell an address in Germany, people ask you to spell: 'Wie schreibt man das?' Knowing the letter names makes this easy.",
sum:"German adds ä ö ü ß. Learn ei = eye, ie = ee, eu = oy, w = v, z = ts, sp/st = schp/scht. Final b, d, g sound like p, t, k.",
vocab:[["Wasser","ماء"],["Straße","شارع"],["Zeit","وقت"],["Eis","آيس كريم / ثلج"],["Bier","بيرة"]],
exam:[["mc","The 'ie' in 'Bier' sounds like:",["eye","a long 'ee'","'oy'"],1,"ie is pronounced as a long ee."],
["mc","German 'w' sounds like English:",["w","v","f"],1,"Wasser sounds like 'vasser'."],
["tf","German 'z' is pronounced 'ts'.",true,"Zeit = tsite."],
["mc","'sp' at the start of a word, as in 'sprechen', sounds like:",["sp","schp","zp"],1,"At the start of a word sp is pronounced schp."],
["mc","The 'ei' in 'nein' sounds like:",["ee","eye","ay"],1,"ei is like English 'eye'."],
["tx","Write 'Straße' using ss instead of ß.",["strasse"],"ß is written ss when it is not available (for example in Switzerland)."],
["tx","Write the German word for 'ice cream'. (It starts with E and has 3 letters.)",["eis"],"Eis = ice cream."],
["mc","Which word has a soft 'ch'?",["Nacht","ich","Buch"],1,"ch is soft after i."]]},
{id:"de-a1-greet",title:"Greetings and introducing yourself",
obj:["Greet people at different times of day","Introduce yourself with heißen, kommen and sein","Choose between du and Sie"],
body:"<p><b>Greetings:</b> Hallo (informal), Guten Morgen (morning), Guten Tag (daytime), Guten Abend (evening), Tschüss (informal goodbye), Auf Wiedersehen (formal goodbye).</p><p><b>Introductions:</b> Ich heiße Shadn. / Mein Name ist Shadn. – Wie heißt du? – Woher kommst du? – Ich komme aus Ägypten.</p><table><tr><th></th><th>heißen</th><th>kommen</th><th>sein</th></tr><tr><td>ich</td><td>heiße</td><td>komme</td><td>bin</td></tr><tr><td>du</td><td>heißt</td><td>kommst</td><td>bist</td></tr><tr><td>er / sie / es</td><td>heißt</td><td>kommt</td><td>ist</td></tr><tr><td>wir</td><td>heißen</td><td>kommen</td><td>sind</td></tr><tr><td>ihr</td><td>heißt</td><td>kommt</td><td>seid</td></tr><tr><td>sie / Sie</td><td>heißen</td><td>kommen</td><td>sind</td></tr></table><p><b>du or Sie?</b> Use <i>du</i> with friends, family and children. Use <i>Sie</i> (always with a capital S) with strangers, teachers and in formal situations: <i>Wie heißen Sie? Wie geht es Ihnen?</i></p>",
ex:["Guten Morgen! Wie geht's? – Danke, gut.","Ich heiße Shadn und ich komme aus Ägypten.","Woher kommen Sie? – Ich komme aus Kairo.","Er ist Student.","Wir sind Freunde."],
mist:[["Ich bin heiße Shadn.","Ich heiße Shadn.","heißen already means 'to be called'."],["Wie heißt Sie?","Wie heißen Sie?","Sie takes the plural form of the verb."],["Guten Tag at night","Guten Abend","Use Abend in the evening."]],
ar:"في الألمانية الفعل يتغير حسب الضمير: ich heiße لكن du heißt. وSie (بحرف كبير) هو صيغة الاحترام ويأخذ نفس تصريف sie للجمع.",
prac:[["Complete: Wie ___ du? (heißen)","heißt"],["Complete: Woher ___ Sie? (kommen)","kommen"],["Say in German: My name is Anna.","Ich heiße Anna. / Mein Name ist Anna."]],
real:"At a German university office you say: 'Guten Tag, ich heiße Shadn. Ich komme aus Ägypten.' Use Sie with the staff.",
sum:"Learn the greetings by time of day. Conjugate heißen, kommen, sein for each pronoun. Use du with friends and Sie in formal situations.",
vocab:[["Guten Morgen","صباح الخير"],["Auf Wiedersehen","مع السلامة"],["Danke","شكراً"],["Woher","من أين"],["der Student","طالب"]],
exam:[["mc","Wie ___ du?",["heiße","heißt","heißen"],1,"du takes -st (heißt, because the stem ends in ß)."],
["mc","Wie geht es ___? (formal)",["dir","Ihnen","euch"],1,"The formal dative of Sie is Ihnen."],
["mc","Ich ___ aus Kairo.",["komme","kommst","kommt"],0,"ich takes -e."],
["tf","'Guten Tag' is the normal greeting in the evening.",false,"In the evening we say Guten Abend."],
["tx","Complete: Ich ___ Shadn. (heißen)",["heiße"],"ich heiße."],
["tx","Translate into German: My name is Anna.",["mein name ist anna","ich heiße anna"],"Both forms are correct."],
["mc","Er ___ Student.",["bin","ist","sind"],1,"er takes ist."],
["mc","Which pronoun do you use with your teacher?",["du","ihr","Sie"],2,"Use the formal Sie."]]},
{id:"de-a1-gender",title:"Nouns, gender and articles (der, die, das)",
obj:["Use der, die and das with the right noun","Use the indefinite articles ein and eine","Learn patterns that predict gender"],
body:"<p>Every German noun has a <b>gender</b>: masculine (der), feminine (die) or neuter (das). The plural article is always <b>die</b>. Nouns are always written with a capital letter.</p><table><tr><th></th><th>masculine</th><th>feminine</th><th>neuter</th><th>plural</th></tr><tr><td>the</td><td>der Tisch</td><td>die Lampe</td><td>das Buch</td><td>die Bücher</td></tr><tr><td>a / an</td><td>ein Tisch</td><td>eine Lampe</td><td>ein Buch</td><td>– (no article)</td></tr></table><p><b>Helpful patterns:</b> nouns ending in -ung, -heit, -keit, -schaft, -ion are feminine (die Zeitung, die Universität). Nouns ending in -chen and -lein are neuter (das Mädchen). Days, months and seasons are masculine (der Montag, der Sommer). Always learn a noun <b>with its article</b>.</p>",
ex:["der Mann, die Frau, das Kind","die Zeitung, die Freiheit, die Nation","das Mädchen, das Brötchen","der Montag, der Winter","Ich habe ein Buch und eine Tasche."],
mist:[["die Mädchen (singular)","das Mädchen","-chen nouns are always neuter, even for girls."],["ein Frau","eine Frau","Feminine nouns take eine."],["learning 'Tisch' alone","learn 'der Tisch'","A noun without its article is incomplete."]],
ar:"في العربية الجنس مذكر ومؤنث فقط، أما الألمانية ففيها ثلاثة أجناس. لا تحاولي تخميناً من المعنى، فكلمة Mädchen (فتاة) محايدة. احفظي الكلمة دائماً مع أداتها.",
prac:[["Add the article: ___ Universität","die"],["Add the article: ___ Brötchen","das"],["Add ein or eine: ___ Lampe","eine"]],
real:"In a shop you might say: 'Ich möchte ein Brötchen und eine Zeitung, bitte.' The right article makes you sound natural.",
sum:"Three genders: der, die, das; plural always die. Use ein for masculine and neuter, eine for feminine. Use suffix patterns to guess, and always learn nouns with their article.",
vocab:[["der Tisch","طاولة"],["die Lampe","مصباح"],["das Buch","كتاب"],["das Mädchen","فتاة"],["die Zeitung","جريدة"]],
exam:[["mc","___ Universität",["der","die","das"],1,"Nouns ending in -ität are feminine."],
["mc","___ Mädchen",["der","die","das"],2,"-chen nouns are neuter."],
["tf","Nouns ending in -ung are feminine.",true,"die Zeitung, die Wohnung."],
["tx","Write the article: ___ Buch",["das"],"Buch is neuter."],
["mc","Choose the correct form: ___ Frau",["ein","eine","einen"],1,"Feminine nouns take eine."],
["tx","What is the plural article of 'der Tisch'?",["die"],"The plural article is always die."],
["mc","'Montag' is:",["der Montag","die Montag","das Montag"],0,"Days of the week are masculine."],
["tx","Write the article for 'Brötchen'.",["das"],"-chen nouns are neuter."]]}
]}]}]};

<script>
(function(){
var H=Hub,L=H.L,q=function(i){return document.getElementById(i)};
var E,Es={},cur='english';function sel(k){cur=k;E=Es[k]=Es[k]||{mode:'list',lid:null,res:null}}sel('english');
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?؟]/g,'').replace(/\s+/g,' ').trim()}
function conv(a){return a[0]==='mc'?{t:'mc',q:a[1],o:a[2],a:a[3],e:a[4]}:a[0]==='tf'?{t:'tf',q:a[1],a:a[2],e:a[3]}:{t:'tx',q:a[1],a:a[2],e:a[3]}}
function flat(){var f=[];COURSE[cur].levels.forEach(function(l){l.units.forEach(function(u){u.lessons.forEach(function(x){f.push(x)})})});return f}
function open(i,f){return i===0||H.S.lessonsDone.indexOf(f[i-1].id)>-1}
function qhtml(q,i){var n='q'+i,h='<div class="card"><b>'+(i+1)+'. '+H.esc(q.q)+'</b><br>';
 if(q.t==='mc')h+=q.o.map(function(o,k){return '<label><input type="radio" name="'+n+'" value="'+k+'"> '+H.esc(o)+'</label><br>'}).join('');
 else if(q.t==='tf')h+=['true','false'].map(function(v){return '<label><input type="radio" name="'+n+'" value="'+v+'"> '+(v==='true'?L('True','صح'):L('False','خطأ'))+'</label><br>'}).join('');
 else h+='<input name="'+n+'" autocomplete="off" style="width:100%">';return h+'</div><br>'}
function grade(qs){return qs.map(function(x,i){var el=document.getElementsByName('q'+i),v='',sel='',ans,ok=false;
 if(x.t==='tx'){v=el[0].value;sel=v;ans=x.a[0];ok=x.a.some(function(a){return norm(a)===norm(v)})}
 else{[].forEach.call(el,function(r){if(r.checked)v=r.value});
  if(x.t==='mc'){sel=v===''?'':x.o[v];ans=x.o[x.a];ok=v!==''&&+v===x.a}else{sel=v;ans=String(x.a);ok=v!==''&&(v==='true')===x.a}}
 return {q:x,ok:ok,sel:sel,ans:ans}})}
function show(rs){return rs.map(function(r,i){return '<div class="card"><b>'+(r.ok?'✓ ':'✗ ')+(i+1)+'. '+H.esc(r.q.q)+'</b><br>'+(r.ok?'':'<span class="msg">'+L('Your answer: ','إجابتك: ')+H.esc(r.sel||'—')+'</span><br>')+'<span class="msg">'+L('Correct answer: ','الإجابة الصحيحة: ')+H.esc(r.ans)+'</span><br>'+H.esc(r.q.e||'')+'</div><br>'}).join('')}
function record(rs,name){var S=H.S;rs.forEach(function(r){if(!r.ok&&!S.mistakes.some(function(m){return m.q.q===r.q.q&&m.lesson===name}))S.mistakes.push({id:Date.now()+Math.random(),q:r.q,sel:r.sel,lesson:name,d:H.ds(new Date())})})}
function lesson(x){var S=H.S,tries=S.attempts.filter(function(a){return a.lesson===x.id});

 '<div class="card"><h2>'+L('Note in Arabic','ملاحظة بالعربية')+'</h2><p dir="rtl">'+x.ar+'</p></div><br>'+
 '<div class="card"><h2>'+L('Practice','تدريب')+'</h2>'+x.prac.map(function(p){return '<details><summary>'+p[0]+'</summary><p><b>'+p[1]+'</b></p></details>'}).join('')+'</div><br>'+
 '<div class="card"><h2>'+L('In real life','في الحياة الواقعية')+'</h2><p>'+x.real+'</p></div><br><div class="card"><h2>'+L('Summary','الخلاصة')+'</h2><p>'+x.sum+'</p></div><br>'+
 '<div class="card"><h2>'+L('Key vocabulary','مفردات أساسية')+'</h2>'+x.vocab.map(function(v){return '<div class="item"><span>'+v[0]+' — '+v[1]+'</span><button class="ghost small" data-sv="'+v[0]+'|'+v[1]+'">+ '+L('Save','حفظ')+'</button><button class="ghost small" data-sp="'+v[0]+'">🔊</button></div>'}).join('')+'<div class="msg" id="vm"></div></div><br>'+
 (tries.length?'<div class="card"><h2>'+L('Attempts','المحاولات')+'</h2>'+tries.map(function(a){return '<div>'+a.d+' — '+a.pct+'% '+(a.pct>=80?'✓':'')+'</div>'}).join('')+'</div><br>':'')+
 '<button id="ex">'+(tries.length?L('Retake exam','أعيدي الاختبار'):L('Start exam','ابدئي الاختبار'))+'</button>'}

var base={html:function(){var f=flat(),S=H.S;
 if(E.mode==='lesson')return lesson(f.filter(function(x){return x.id===E.lid})[0]);

 var h='<h1>'+H.t(cur)+'</h1><p class="msg">A1 · '+f.length+' '+L('lessons so far. More are added in later updates.','دروس حالياً، وتُضاف دروس أخرى لاحقاً.')+'</p>';
 COURSE[cur].levels.forEach(function(l){l.units.forEach(function(u){h+='<div class="card"><h2>'+l.id+' — '+H.esc(u.title)+'</h2>'+u.lessons.map(function(x){var i=f.indexOf(x),o=open(i,f),d=S.lessonsDone.indexOf(x.id)>-1;

 [].forEach.call(document.querySelectorAll('[data-sp]'),function(b){b.onclick=function(){q('vm').textContent=H.speak(b.dataset.sp,cur==='german'?'de':'gb')}});

['Passive voice','English','<p>Form: <b>be + past participle</b>. Use it when the action matters more than who did it.</p><p>Active: The teacher marked the exams. → Passive: The exams were marked by the teacher.</p><p>Passive forms: is made, was made, has been made, will be made, can be made.</p>'],
['Reported speech','English',tb(['Direct','Reported'],[['present simple','past simple'],['present continuous','past continuous'],['past simple','past perfect'],['will','would'],['can','could'],['today / tomorrow','that day / the next day']])+'<p>“I am tired,” she said → She said (that) she was tired.</p>'],
['Relative clauses','English','<p><b>who</b> for people, <b>which</b> for things, <b>that</b> for either (defining clauses), <b>whose</b> for possession, <b>where</b> for places.</p><p>The student who sits next to me is from Alexandria. / The book that I bought is useful.</p><p>Non-defining clauses add extra information with commas: My sister, who lives in Cairo, is a teacher.</p>'],
['make vs do','English','<p><b>make:</b> a mistake, a decision, a cup of tea, progress, money, an effort.</p><p><b>do:</b> homework, the housework, your best, research, an exam (British: take or sit an exam).</p>'],
['Linking words','English',tb(['Purpose','Words'],[['Contrast','however, although, despite, whereas'],['Addition','moreover, in addition, also'],['Result','therefore, as a result, so'],['Reason','because, since, due to'],['Sequence','first, then, finally']])],
['Writing essays and citing sources','Academic','<p><b>Essay:</b> introduction (hook, background, thesis), body paragraphs (topic sentence, evidence, explanation), conclusion (restate thesis, summarise, final thought).</p><p><b>Citation:</b> APA, MLA and Harvard are common styles. In-text examples: (Smith, 2020) in APA and Harvard; (Smith 45) in MLA. Always ask your department which style is required.</p>'],
['German cases','German',tb(['Case','masc.','fem.','neut.','plural'],[['Nominativ','der','die','das','die'],['Akkusativ','den','die','das','die'],['Dativ','dem','der','dem','den (+n)'],['Genitiv','des (+s)','der','des (+s)','der']])+'<p>Nominative = subject. Accusative = direct object. Dative = indirect object. Genitive = possession.</p>'],
['German personal pronouns','German',tb(['Nominativ','Akkusativ','Dativ'],[['ich','mich','mir'],['du','dich','dir'],['er','ihn','ihm'],['sie','sie','ihr'],['es','es','ihm'],['wir','uns','uns'],['ihr','euch','euch'],['sie / Sie','sie / Sie','ihnen / Ihnen']])],
['German word order','German','<p><b>Main clause:</b> the verb is in position 2. Ich lerne heute Deutsch. / Heute lerne ich Deutsch.</p><p><b>Yes/no question:</b> verb first. Lernst du Deutsch?</p><p><b>W-question:</b> question word, verb, subject. Was lernst du?</p><p><b>Subordinate clause</b> (weil, dass, wenn, ob): verb at the end. Ich bleibe zu Hause, weil ich müde bin.</p>'],
['German modal verbs','German',tb(['','können','müssen','wollen','sollen','dürfen','mögen'],[['ich','kann','muss','will','soll','darf','mag'],['du','kannst','musst','willst','sollst','darfst','magst'],['er/sie/es','kann','muss','will','soll','darf','mag'],['wir/sie','können','müssen','wollen','sollen','dürfen','mögen']])+'<p>The second verb goes to the end in the infinitive: Ich kann gut schwimmen.</p>'],
['German separable verbs','German','<p>The prefix separates in main clauses and goes to the end: <i>anrufen</i> → Ich rufe dich an. <i>aufstehen</i> → Er steht um 7 Uhr auf. <i>einkaufen</i> → Wir kaufen heute ein.</p><p>In the infinitive and with modals they stay together: Ich muss früh aufstehen.</p>'],
['Two-way prepositions','German','<p>an, auf, hinter, in, neben, über, unter, vor, zwischen.</p><p><b>Wo? (location) → Dativ:</b> Das Buch liegt auf dem Tisch.</p><p><b>Wohin? (movement) → Akkusativ:</b> Ich lege das Buch auf den Tisch.</p>'],
['German Perfekt (spoken past)','German','<p>haben or sein + Partizip II. <i>Ich habe Deutsch gelernt.</i> <i>Ich bin nach Berlin gefahren.</i></p><p>Use <b>sein</b> for movement or change of state (gehen, kommen, fahren, bleiben, sein, werden); use <b>haben</b> for most other verbs.</p>'],
['German numbers and days','German',tb(['0–20','Days'],[['null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn','Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag'],['elf, zwölf, dreizehn, vierzehn, fünfzehn, sechzehn, siebzehn, achtzehn, neunzehn, zwanzig','Months: Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember']])],
['Konjunktiv II basics','German','<p>For wishes and polite requests: <b>wäre</b> (sein), <b>hätte</b> (haben), <b>würde + Infinitiv</b>.</p><p>Ich hätte gern einen Kaffee. / Wenn ich Zeit hätte, würde ich reisen. / Wäre ich nur reicher!</p>'],
['Phonetics and phonology','Linguistics','<p><b>Phonetics</b> studies physical speech sounds (articulatory, acoustic, auditory). <b>Phonology</b> studies how sounds work as a system.</p><p><b>Phoneme:</b> smallest sound unit that changes meaning (/p/ vs /b/ in pat/bat). <b>Allophone:</b> a variant of a phoneme (aspirated and unaspirated /p/). <b>Minimal pair:</b> two words differing in one phoneme.</p>'],
['Morphology and syntax','Linguistics','<p><b>Morpheme:</b> smallest unit of meaning. <b>Free</b> (book) or <b>bound</b> (un-, -ed). Types: root, prefix, suffix; inflectional (plural -s) and derivational (happy → happiness).</p><p><b>Syntax:</b> how words form phrases and sentences. Constituents: noun phrase, verb phrase, clause. Tree diagrams show structure.</p>'],
['Semantics and pragmatics','Linguistics','<p><b>Semantics:</b> meaning of words and sentences (synonymy, antonymy, polysemy, hyponymy).</p><p><b>Pragmatics:</b> meaning in context. <b>Speech acts</b> (Austin, Searle): locutionary, illocutionary, perlocutionary. <b>Grice’s maxims:</b> quantity, quality, relation, manner. <b>Deixis:</b> words that depend on context (I, here, now).</p>'],
['Sociolinguistics','Linguistics','<p><b>Register:</b> language variety by situation (formal, informal). <b>Dialect:</b> variety by region or group. <b>Diglossia:</b> two varieties used in different functions (Modern Standard Arabic and colloquial Arabic). <b>Code-switching:</b> alternating between languages in conversation.</p>'],
['Translation theory','Translation','<p><b>Nida:</b> formal equivalence (stays close to form) vs dynamic equivalence (same effect on the reader). <b>Newmark:</b> semantic vs communicative translation. <b>Venuti:</b> domestication (natural for target readers) vs foreignisation (keeps the foreign feel). <b>Skopos theory (Vermeer):</b> the purpose of the translation decides the method.</p><p>Common problems: false friends, idioms, cultural terms, word order, register.</p>'],
['Interpreting basics','Translation','<p><b>Consecutive:</b> the speaker pauses, the interpreter renders the speech, usually with notes. <b>Simultaneous:</b> the interpreter speaks almost at the same time as the speaker, usually from a booth.</p><p>Skills: active listening, memory, note-taking with symbols, paraphrasing, staying neutral.</p>'],
['Literary terms','Literature',tb(['Term','Meaning'],[['simile','comparison with like or as'],['metaphor','direct comparison without like or as'],['personification','giving human qualities to things'],['irony','meaning the opposite, or a gap between expectation and reality'],['alliteration','repeated initial consonant sounds'],['sonnet','14-line poem'],['iambic pentameter','five pairs of unstressed + stressed syllables per line'],['stream of consciousness','narration that follows a character’s thoughts'],['protagonist / antagonist','main character / opposing force']])]];
